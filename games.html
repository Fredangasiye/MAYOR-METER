<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eaf8ff">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Luckiest+Guy&display=swap" rel="stylesheet">
<meta name="description" content="Quick quiz rounds on the Johannesburg mayoral race, built from public reporting, with a source for every answer.">
<title>Mayor Meter Arcade: play, learn, challenge</title>
<style>
:root{--mm-ink:#101a33;--mm-bg:#eaf8ff;--mm-muted:#4a5878;--mm-y:#ffd23f;--mm-g:#35d07f;--mm-gd:#0a7a43;--mm-pink:#ff5a67;--mm-blue:#0a6cff;--mm-disp:'Luckiest Guy',Impact,'Arial Black',sans-serif}
*{box-sizing:border-box}
html{background:var(--mm-bg);scroll-behavior:smooth}
body{margin:0;min-height:100vh;color:var(--mm-ink);background:var(--mm-bg);font:500 16px/1.45 Fredoka,ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
body:before{content:"";position:fixed;left:0;right:0;bottom:0;height:34vh;max-height:300px;background:#cdeefb;pointer-events:none;z-index:0;clip-path:polygon(0 100%,0 70%,4% 70%,4% 52%,8% 52%,8% 64%,12% 64%,12% 40%,15% 40%,15% 58%,20% 58%,20% 46%,24% 46%,24% 66%,29% 66%,29% 34%,32% 30%,35% 34%,35% 60%,41% 60%,41% 50%,46% 50%,46% 68%,52% 68%,52% 42%,56% 42%,56% 62%,62% 62%,62% 48%,66% 48%,66% 56%,72% 56%,72% 36%,75% 36%,75% 60%,81% 60%,81% 52%,86% 52%,86% 66%,92% 66%,92% 44%,96% 44%,96% 62%,100% 62%,100% 100%)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--mm-blue);outline-offset:3px}
button:disabled{cursor:not-allowed;opacity:.5}
.mm-shell{position:relative;z-index:1;width:min(100%,1120px);margin:auto;padding:0 22px 48px}
.mm-topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 0 20px;border-bottom:3px solid var(--mm-ink)}
.mm-brand{display:flex;align-items:center;gap:12px;color:var(--mm-ink);text-decoration:none}
.mm-brand-mark{display:block;width:48px;height:48px;flex:none}
.mm-brand-mark svg{display:block;width:100%;height:100%;overflow:visible}
.mm-brand-mark .needle{transform-origin:50px 52px;animation:mm-swing 2.4s ease-in-out infinite alternate}
@keyframes mm-swing{from{rotate:-62deg}to{rotate:62deg}}
.mm-brand-name{display:block;font:400 30px/1 var(--mm-disp);letter-spacing:.02em;color:var(--mm-y);-webkit-text-stroke:.14em var(--mm-ink);paint-order:stroke fill;filter:drop-shadow(2px 3px 0 var(--mm-ink))}
.mm-brand-sub{display:block;margin-top:3px;color:var(--mm-muted);font-size:13px;font-weight:700}
.mm-top-pill,.mm-tag{display:inline-flex;align-items:center;gap:7px;border:3px solid var(--mm-ink);border-radius:999px;padding:6px 12px;background:#fff;color:var(--mm-ink);font-weight:700;font-size:13px}
.mm-dot{width:10px;height:10px;border-radius:50%;background:var(--mm-g);border:2px solid var(--mm-ink);display:inline-block}
.mm-screen{animation:mm-in .22s ease-out}
@keyframes mm-in{from{opacity:.3;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.mm-hero{padding:30px 0 22px;display:grid;grid-template-columns:1.25fr .75fr;gap:28px;align-items:center}
.mm-eyebrow{font-size:15px;font-weight:700;color:var(--mm-gd);display:flex;align-items:center;gap:9px}
.mm-hero h1{font:400 clamp(44px,6.4vw,78px)/1 var(--mm-disp);letter-spacing:.01em;max-width:700px;margin:14px 0 16px}
.mm-hero h1 em{font-style:normal;color:var(--mm-y);-webkit-text-stroke:.1em var(--mm-ink);paint-order:stroke fill;filter:drop-shadow(.03em .05em 0 var(--mm-ink))}
.mm-hero p{max-width:550px;color:var(--mm-muted);font-size:17px;line-height:1.55;margin:0}
.mm-hero-art{position:relative;min-height:220px;border:3px solid var(--mm-ink);border-radius:28px;background:linear-gradient(#7fd3ff,#e2f7ff 80%);overflow:hidden;display:grid;place-items:center;box-shadow:0 8px 0 var(--mm-ink)}
.mm-hero-art:before{content:"";position:absolute;right:16%;top:18px;width:46px;height:46px;border-radius:50%;background:var(--mm-y);border:3px solid var(--mm-ink)}
.mm-hero-art:after{content:"";position:absolute;left:0;right:0;bottom:0;height:46%;background:#b9e6f7;clip-path:polygon(0 100%,0 60%,8% 60%,8% 35%,16% 35%,16% 55%,24% 55%,24% 20%,30% 20%,30% 50%,40% 50%,40% 30%,48% 30%,48% 60%,58% 60%,58% 15%,64% 15%,64% 45%,74% 45%,74% 32%,82% 32%,82% 58%,92% 58%,92% 40%,100% 40%,100% 100%)}
.mm-art-big{position:relative;z-index:1;font-size:104px;transform:rotate(-8deg);filter:drop-shadow(0 8px 0 rgba(16,26,51,.25))}
.mm-art-sticker{position:absolute;z-index:1;top:16px;left:14px;background:var(--mm-y);color:var(--mm-ink);font-weight:700;padding:7px 12px;border:3px solid var(--mm-ink);border-radius:10px;font-size:13px;transform:rotate(-6deg);box-shadow:0 3px 0 var(--mm-ink)}
.mm-art-caption{position:absolute;z-index:1;bottom:12px;left:0;right:0;text-align:center;font-size:13px;font-weight:700;color:var(--mm-ink)}
.mm-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:2px 0 30px}
.mm-stat{padding:12px 16px;border:3px solid var(--mm-ink);background:#fff;border-radius:16px;box-shadow:0 4px 0 var(--mm-ink)}
.mm-stat b{display:block;font:400 30px/1.1 var(--mm-disp)}
.mm-stat span{font-size:13px;color:var(--mm-muted);font-weight:700}
.mm-section-head{display:flex;align-items:end;justify-content:space-between;gap:16px;margin:24px 0 16px}
.mm-section-head h2{font:400 32px/1.05 var(--mm-disp);margin:0}
.mm-section-head p{margin:4px 0 0;color:var(--mm-muted);font-size:15px}
.mm-candidate-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.mm-candidate{--c:#35d07f;position:relative;overflow:hidden;text-align:left;border:3px solid var(--mm-ink);border-radius:22px;padding:18px;background:#fff;color:var(--mm-ink);box-shadow:0 6px 0 var(--mm-ink);transition:transform .15s,box-shadow .15s,background .15s;min-height:210px}
.mm-candidate:hover{transform:translateY(-3px);box-shadow:0 9px 0 var(--mm-ink);background:color-mix(in srgb,var(--c) 16%,#fff)}
.mm-candidate:active{transform:translateY(3px);box-shadow:0 2px 0 var(--mm-ink)}
.mm-cand-top{display:flex;align-items:start;justify-content:space-between;gap:8px}
.mm-avatar{width:58px;height:58px;border-radius:50%;border:3px solid var(--mm-ink);display:grid;place-items:center;color:var(--mm-ink);font:400 24px/1 var(--mm-disp);background:var(--c)}
.mm-arrow{color:var(--mm-ink);font-size:24px;font-weight:700}
.mm-candidate h3{font:400 24px/1.05 var(--mm-disp);margin:16px 0 4px}
.mm-candidate .mm-party{font-size:14px;color:var(--mm-muted);font-weight:700}
.mm-candidate .mm-teaser{color:var(--mm-ink);font-size:15px;margin:9px 0 0;max-width:260px}
.mm-hint{margin-top:12px;color:var(--mm-muted);font-size:12px;font-weight:700}
.mm-footnote{font-size:13px;color:var(--mm-muted);margin:20px 0 0;line-height:1.6}
.mm-btn{border:3px solid var(--mm-ink);border-radius:14px;min-height:48px;padding:10px 18px;background:var(--mm-y);color:var(--mm-ink);font-weight:700;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:9px;box-shadow:0 4px 0 var(--mm-ink);text-decoration:none;transition:transform .12s,box-shadow .12s}
.mm-btn:hover{transform:translateY(-1px);box-shadow:0 5px 0 var(--mm-ink)}
.mm-btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--mm-ink)}
.mm-btn-secondary{background:#fff}
.mm-btn-quiet{background:transparent}
.mm-btn-small{min-height:40px;padding:7px 14px;font-size:14px;border-radius:12px;white-space:nowrap}
.mm-full{width:100%}
.mm-back{display:inline-flex;align-items:center;gap:8px;border:0;background:transparent;color:var(--mm-ink);font-weight:700;font-size:15px;padding:10px 0;margin:16px 0 12px}
.mm-back:hover{text-decoration:underline}
.mm-profile-banner{display:flex;gap:15px;align-items:center;padding:16px;border:3px solid var(--mm-ink);border-radius:20px;background:#fff;box-shadow:0 5px 0 var(--mm-ink);margin:0 0 24px}
.mm-profile-avatar{width:60px;height:60px;border-radius:50%;border:3px solid var(--mm-ink);display:grid;place-items:center;color:var(--mm-ink);font:400 26px/1 var(--mm-disp);flex:none}
.mm-profile-info{min-width:0;flex:1}
.mm-profile-info h2{margin:0;font:400 26px/1.05 var(--mm-disp)}
.mm-profile-info p{margin:4px 0 0;color:var(--mm-muted);font-size:14px}
.mm-mini-score{text-align:right;flex:none}
.mm-mini-score b{font:400 26px/1 var(--mm-disp);display:block}
.mm-mini-score span{font-size:12px;color:var(--mm-muted);font-weight:700}
.mm-games-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.mm-game-card{--gc:#35d07f;position:relative;display:flex;flex-direction:column;min-height:245px;text-align:left;color:var(--mm-ink);padding:20px;border:3px solid var(--mm-ink);border-radius:22px;overflow:hidden;background:#fff;box-shadow:0 6px 0 var(--mm-ink);transition:transform .15s,box-shadow .15s}
.mm-game-card:hover{transform:translateY(-3px);box-shadow:0 9px 0 var(--mm-ink)}
.mm-game-card:before{content:"";position:absolute;right:-24px;top:-28px;width:120px;height:120px;border-radius:50%;background:var(--gc);opacity:.35}
.mm-game-icon{position:relative;font-size:34px;margin-bottom:14px}
.mm-game-card h3{position:relative;font:400 26px/1.05 var(--mm-disp);margin:0 0 9px;max-width:270px}
.mm-game-card p{position:relative;font-size:15px;color:var(--mm-muted);line-height:1.5;margin:0 0 18px;max-width:330px}
.mm-game-meta{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto}
.mm-game-meta span{font-size:13px;font-weight:700;color:var(--mm-ink);background:var(--gc);border:2px solid var(--mm-ink);border-radius:99px;padding:3px 10px}
.mm-play-arrow{height:38px;width:38px;border-radius:50%;background:var(--gc);color:var(--mm-ink);border:3px solid var(--mm-ink);display:grid;place-items:center;font-weight:700}
.mm-tagline{padding:12px 14px;border-radius:14px;border:3px solid var(--mm-ink);background:#fff8d6;color:var(--mm-ink);font-size:15px;line-height:1.5;margin:0 0 20px}
.mm-tagline strong{color:var(--mm-gd)}
.mm-game-layout{max-width:760px;margin:0 auto}
.mm-game-head{display:flex;align-items:center;gap:12px;margin:8px 0 18px}
.mm-game-icon-box{width:50px;height:50px;display:grid;place-items:center;border-radius:50%;border:3px solid var(--mm-ink);background:var(--mm-y);font-size:24px;flex:none}
.mm-game-head h2{font:400 26px/1.05 var(--mm-disp);margin:0}
.mm-game-head p{font-size:14px;color:var(--mm-muted);margin:3px 0 0}
.mm-head-score{margin-left:auto;text-align:right}
.mm-head-score b{font:400 28px/1 var(--mm-disp);display:block}
.mm-head-score span{font-size:12px;font-weight:700;color:var(--mm-muted)}
.mm-progress-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 8px}
.mm-progress-label{font-size:13px;color:var(--mm-muted);font-weight:700}
.mm-progress-track{height:14px;background:#fff;border:3px solid var(--mm-ink);border-radius:99px;overflow:hidden;margin-bottom:18px}
.mm-progress-fill{height:100%;width:0;background:var(--mm-g);border-radius:99px;transition:width .25s ease}
.mm-question-card{border:3px solid var(--mm-ink);border-radius:24px;padding:clamp(20px,4vw,30px);background:#fff;box-shadow:0 7px 0 var(--mm-ink)}
.mm-q-kicker{font-size:13px;font-weight:700;color:var(--mm-gd);margin:0 0 12px}
.mm-question-card h3{font:700 clamp(22px,3.6vw,30px)/1.2 Fredoka,system-ui,sans-serif;margin:0 0 22px}
.mm-options{display:grid;gap:10px}
.mm-option{display:flex;align-items:center;gap:12px;text-align:left;min-height:58px;padding:11px 14px;border:3px solid var(--mm-ink);border-radius:14px;background:#fff;color:var(--mm-ink);box-shadow:0 3px 0 var(--mm-ink);transition:background .12s,transform .12s,box-shadow .12s}
.mm-option:hover:not(:disabled){background:#fff3b8}
.mm-option:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--mm-ink)}
.mm-option-key{width:34px;height:34px;border:3px solid var(--mm-ink);border-radius:50%;display:grid;place-items:center;font:400 15px/1 var(--mm-disp);flex:none;background:#eaf8ff}
.mm-option-text{font-size:16px;font-weight:600;line-height:1.35}
.mm-option:disabled{opacity:1}
.mm-option:disabled:not(.mm-correct):not(.mm-wrong){opacity:.55;box-shadow:none}
.mm-option.mm-correct{background:#c9f3dc}.mm-option.mm-correct .mm-option-key{background:var(--mm-g)}
.mm-option.mm-wrong{background:#ffd9dd}.mm-option.mm-wrong .mm-option-key{background:var(--mm-pink)}
.mm-feedback{margin-top:14px;padding:14px;border:3px solid var(--mm-ink);border-radius:14px;background:#fff;animation:mm-in .2s ease}
.mm-feedback h4{margin:0 0 5px;font-size:17px;font-weight:700}
.mm-feedback p{margin:0;color:var(--mm-ink);font-size:15px;line-height:1.55}
.mm-feedback .mm-source{color:var(--mm-muted);font-size:12px;margin-top:8px}
.mm-feedback-good{background:#dcf7e8}.mm-feedback-good h4{color:var(--mm-gd)}
.mm-feedback-bad{background:#ffe6e8}.mm-feedback-bad h4{color:#b3202e}
.mm-question-actions{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:18px}
.mm-tip{font-size:13px;color:var(--mm-muted)}
.mm-result-hero{position:relative;padding:28px 22px;border:3px solid var(--mm-ink);border-radius:26px;background:linear-gradient(#bfe9ff,#e8f8ff);text-align:center;overflow:hidden;box-shadow:0 8px 0 var(--mm-ink)}
.mm-result-badge{display:inline-flex;gap:7px;align-items:center;border:3px solid var(--mm-ink);background:var(--mm-y);border-radius:999px;padding:6px 12px;color:var(--mm-ink);font-size:14px;font-weight:700}
.mm-result-emoji{font-size:60px;margin:14px 0 4px}
.mm-result-hero h2{font:400 clamp(32px,5.4vw,46px)/1.02 var(--mm-disp);margin:10px 0}
.mm-result-hero p{font-size:16px;color:var(--mm-ink);margin:0 auto;max-width:480px;line-height:1.5}
.mm-score-big{font:400 clamp(52px,9vw,80px)/1 var(--mm-disp);color:var(--mm-y);-webkit-text-stroke:.1em var(--mm-ink);paint-order:stroke fill;filter:drop-shadow(.03em .05em 0 var(--mm-ink));margin:14px 0 0}
.mm-score-big small{font-size:.3em;color:var(--mm-ink);-webkit-text-stroke:0;letter-spacing:.02em}
.mm-result-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:14px 0}
.mm-result-stat{border:3px solid var(--mm-ink);background:#fff;border-radius:16px;padding:14px 8px;text-align:center;box-shadow:0 4px 0 var(--mm-ink)}
.mm-result-stat b{display:block;font:400 26px/1.1 var(--mm-disp)}
.mm-result-stat span{display:block;color:var(--mm-muted);font-size:13px;font-weight:700;margin-top:2px}
.mm-result-actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.mm-smallprint{color:var(--mm-muted);font-size:12px;line-height:1.6;margin-top:14px}
.mm-mayor-meter{margin:12px 0 0;padding:16px;border:3px solid var(--mm-ink);border-radius:20px;background:#fff;box-shadow:0 5px 0 var(--mm-ink)}
.mm-budget-top{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:13px 0 17px}
.mm-budget-stat{padding:12px 10px;background:#eaf8ff;border:3px solid var(--mm-ink);border-radius:14px;text-align:center}
.mm-budget-stat b{display:block;font:400 24px/1.1 var(--mm-disp)}
.mm-budget-stat span{color:var(--mm-muted);font-size:12px;font-weight:700}
.mm-budget-track{height:12px;border-radius:99px;background:#fff;border:2px solid var(--mm-ink);overflow:hidden;margin-top:7px}
.mm-budget-track div{height:100%;background:var(--mm-g);transition:width .2s}
.mm-choice-grid{display:grid;gap:12px}
.mm-budget-choice{border:3px solid var(--mm-ink);background:#fff;border-radius:16px;padding:14px;text-align:left;color:var(--mm-ink);display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;box-shadow:0 4px 0 var(--mm-ink)}
.mm-budget-choice:hover:not(:disabled){background:#fff3b8}
.mm-budget-choice b{display:block;font-size:16px}
.mm-budget-choice small{display:block;font-size:14px;color:var(--mm-muted);margin-top:4px;line-height:1.45}
.mm-cost{white-space:nowrap;text-align:right;font-size:14px;font-weight:700;color:var(--mm-gd)}
.mm-cost small{color:var(--mm-muted);display:block;font-weight:600;font-size:12px}
.mm-mayor-ending{padding:16px;border-radius:16px;margin-top:14px;background:#fff8d6;border:3px solid var(--mm-ink)}
.mm-mayor-ending h4{margin:0 0 5px;color:var(--mm-ink);font-size:18px}
.mm-mayor-ending p{margin:0;color:var(--mm-ink);font-size:15px;line-height:1.55}
.mm-empty{padding:20px;border:3px dashed var(--mm-ink);border-radius:17px;color:var(--mm-muted);font-size:15px}
.mm-status{padding:16px;border:3px solid var(--mm-ink);border-radius:20px;background:#fff;box-shadow:0 5px 0 var(--mm-ink);margin:0 0 24px}
.mm-status h3{margin:0 0 8px;font:400 20px/1.1 var(--mm-disp)}
.mm-status p{margin:0 0 10px;font-size:15px;line-height:1.55}
.mm-about summary{cursor:pointer;font-weight:700;margin:2px 0 8px}
.mm-status-src{font-size:13px;color:var(--mm-muted);margin:0}
.mm-status a,.mm-source a{color:#0b5cad;font-weight:700;word-break:break-word}
.mm-result-line{font-size:12px;color:var(--mm-muted);font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-top:6px}
.mm-credit{display:block;margin-top:14px;text-align:center;font-size:12px;font-weight:700;letter-spacing:.08em}
@media(max-width:700px){
.mm-shell{padding:0 14px 32px}.mm-topbar{padding:14px 0}.mm-brand-mark{width:40px;height:40px}.mm-brand-name{font-size:24px}.mm-brand-sub{font-size:12px}
.mm-hero{grid-template-columns:1fr;gap:18px;padding:24px 0 18px}.mm-hero h1{font-size:clamp(42px,12.5vw,62px)}.mm-hero p{font-size:15px}
.mm-hero-art{min-height:130px}.mm-art-big{font-size:70px}.mm-art-sticker{top:10px;left:10px;font-size:12px;padding:5px 9px}.mm-hero-art:before{width:34px;height:34px;top:12px}
.mm-stats{gap:8px;margin-bottom:22px}.mm-stat{padding:10px}.mm-stat b{font-size:24px}.mm-stat span{font-size:12px}
.mm-section-head{align-items:start;margin-top:20px}.mm-section-head h2{font-size:26px}
.mm-candidate-grid{grid-template-columns:1fr;gap:12px}
.mm-candidate{min-height:0;padding:14px;display:grid;grid-template-columns:54px 1fr auto;align-items:center;column-gap:12px}
.mm-cand-top{display:contents}.mm-avatar{grid-column:1;grid-row:1/span 3;width:54px;height:54px;font-size:22px}
.mm-arrow{grid-column:3;grid-row:1;font-size:22px}
.mm-candidate h3{grid-column:2;grid-row:1;margin:0;font-size:21px}
.mm-candidate .mm-party{grid-column:2;grid-row:2;margin-top:3px;font-size:13px}
.mm-candidate .mm-teaser{grid-column:2/4;grid-row:3;margin:8px 0 0;font-size:14px}
.mm-hint{grid-column:2/4;grid-row:4;margin-top:8px}
.mm-games-grid{grid-template-columns:1fr;gap:12px}
.mm-game-card{min-height:0;padding:16px;display:grid;grid-template-columns:44px 1fr 38px;column-gap:12px;align-items:start}
.mm-game-icon{grid-column:1;grid-row:1/span 2;margin:0;font-size:30px}
.mm-game-card h3{grid-column:2;grid-row:1;margin:0 0 6px;font-size:22px}
.mm-game-card p{grid-column:2/4;grid-row:2;margin:0 0 12px;font-size:14px}
.mm-game-meta{grid-column:2/4;grid-row:3}.mm-play-arrow{grid-column:3;grid-row:1;width:34px;height:34px}

const MM_DATA = {"contentUpdated":"2026-10-28","electionDate":"4 November 2026","candidateRoundsEnabled":true,"city":"Johannesburg, South Africa","coverageNote":"These profiles cover the eight names listed on Polymarket’s “Next Mayor of Johannesburg?” market plus the EFF’s Tlaleng Mofokeng and the IFP’s Mlungisi Mabaso. It is not a full ballot list, because other parties have candidates too. The market resolves to whoever the council elects mayor after the vote, not only to declared candidates.","candidates":[{"id":"frank-chikane","name":"Frank Chikane","initials":"FC","party":"ANC · shortlisted; final election-list status disputed","color":"#35d07f","tag":"Veteran figure · registration status unresolved","status":"As of 28 October 2026: Chikane was publicly shortlisted by the ANC, but had not been confirmed in writing as the Joburg mayoral candidate. He does not appear on the ANC’s certified Johannesburg list. ANC secretary-general Fikile Mbalula called the omission an error, some ANC leaders and commentators have questioned that explanation, and a regional official said national office-bearers could still nominate him. TimesLIVE reported on 25 October that he lacked written confirmation. Do not label him a confirmed candidate without a newer official update.","profile":"Reverend Frank Chikane is a pastor, anti-apartheid activist and former senior civil servant. South African History Online records that he became General Secretary of the South African Council of Churches in 1987 and Director-General in the Presidency from 1999 to 2009. As of 25 October 2026, reporting said he lacked written confirmation as the ANC’s Joburg mayoral candidate; a party regional official said he could still be nominated, so his status is not settled.","sources":["https://www.iol.co.za/news/politics/anc-names-chikane-morero-and-masuku-as-potential-johannesburg-mayoral-candidates-76c3476a-f388-41a8-9c89-4735f5b2e333","https://www.dailymaverick.co.za/article/2026-10-19-anc-abandons-plan-to-name-mayoral-candidates-amid-fears-of-supporter-backlash/","https://www.businessday.co.za/politics/2026-10-20-chikanes-mayoral-hopes-rest-with-anc-national-leaders/","https://www.timeslive.co.za/politics/2026-09-08-chikane-left-off-anc-mayoral-list-in-error-explains-mbalula/","https://www.timeslive.co.za/news/2026-10-24-why-chikane-has-been-largely-absent-from-the-ancs-election-campaign/"],"promise":[{"statement":"South African History Online records that Chikane became General Secretary of the South African Council of Churches in 1987.","kind":"result","explain":"This is a documented historical office, not a claim about his performance as a Johannesburg mayor.","source":"South African History Online — Frank Chikane biography"},{"statement":"His biography records that he served as Director-General in the Presidency from 1999 to 2009.","kind":"result","explain":"The biographical record supports this past role. It should not be confused with a municipal performance result.","source":"South African History Online — Frank Chikane biography"},{"statement":"By 28 October 2026, the ANC had clearly confirmed Chikane as its final Johannesburg mayoral candidate and his election-list status was undisputed.","kind":"contradicted","explain":"The ANC did not publicly name one preferred Joburg candidate by 19 October. By 25 October, TimesLIVE reported that Chikane still lacked written confirmation and an undertaking that his name would be included on the PR councillor list, while an ANC regional official said national office-bearers could still nominate him. Treat the status as unresolved.","source":"TimesLIVE — Why Chikane has been largely absent from the ANC’s election campaign (25 Oct 2026) — https://www.timeslive.co.za/news/2026-10-24-why-chikane-has-been-largely-absent-from-the-ancs-election-campaign/"},{"statement":"Chikane was included in the ANC’s publicly reported group of three potential Johannesburg mayoral candidates in August.","kind":"result","explain":"IOL reported him alongside incumbent mayor Dada Morero and deputy mayor Loyiso Masuku as potential choices, not as a final selection.","source":"IOL — ANC names Chikane, Morero and Masuku as potential Johannesburg mayoral candidates (Aug 2026) — https://www.iol.co.za/news/politics/anc-names-chikane-morero-and-masuku-as-potential-johannesburg-mayoral-candidates-76c3476a-f388-41a8-9c89-4735f5b2e333"}],"quiz":[{"q":"Which organisation did Chikane become General Secretary of in 1987?","options":["South African Council of Churches","Democratic Alliance","City of Johannesburg","RISE Mzansi"],"a":0,"explain":"South African History Online records his appointment as General Secretary of the South African Council of Churches in July 1987.","source":"South African History Online — Frank Chikane biography"},{"q":"Which senior public-service role did Chikane hold from 1999 to 2009, according to his biography?","options":["Gauteng Premier","Director-General in the Presidency","Johannesburg mayor","Transport MMC"],"a":1,"explain":"His biography records him as Director-General in the Presidency from June 1999 until 2009.","source":"South African History Online — Frank Chikane biography"},{"q":"Which description best reflects his ANC mayoral status as of late October 2026?","options":["Confirmed sole nominee with no dispute","Publicly shortlisted, but final nomination/election-list status requires caution","Mayor since 2016","DA candidate"],"a":1,"explain":"The ANC shortlist and later reports about candidate registration mean the status should be described carefully.","source":"TimesLIVE — Why Chikane has been largely absent from the ANC’s election campaign (25 Oct 2026) — https://www.timeslive.co.za/news/2026-10-24-why-chikane-has-been-largely-absent-from-the-ancs-election-campaign/"},{"q":"What did Business Day report on 20 October about Chikane and the ANC’s certified Johannesburg list?","options":["He was not on the certified list, but ANC national office-bearers could still nominate him","He topped the certified list as the ANC’s confirmed mayoral candidate","He had withdrawn from the race and joined another party","He was already serving as Johannesburg’s mayor"],"a":0,"explain":"Business Day reported that Chikane does not appear on the ANC’s certified Johannesburg list, while the ANC’s Johannesburg regional secretary said national office-bearers could still nominate him. His status is therefore unsettled.","source":"Business Day — Chikane’s mayoral hopes rest with ANC national leaders (20 Oct 2026) — https://www.businessday.co.za/politics/2026-10-20-chikanes-mayoral-hopes-rest-with-anc-national-leaders/"}],"memory":[{"q":"Which year did Chikane become General Secretary of the South African Council of Churches?","options":["1977","1987","1997","2007"],"a":1,"explain":"South African History Online gives July 1987.","source":"South African History Online — Frank Chikane biography"},{"q":"When did his biography say he was Director-General in the Presidency?","options":["1983–1987","1987–1994","1999–2009","2014–2022"],"a":2,"explain":"The biographical account gives June 1999 to 2009.","source":"South African History Online — Frank Chikane biography"},{"q":"Who were the other two people named with Chikane on the ANC’s public Joburg shortlist?","options":["Helen Zille and Herman Mashaba","Dada Morero and Loyiso Masuku","David Makhura and Kenny Kunene","Lukhona Mnguni and Dada Morero"],"a":1,"explain":"The public shortlist named incumbent mayor Morero and deputy mayor Masuku with Chikane.","source":"IOL — ANC names Chikane, Morero and Masuku as potential Johannesburg mayoral candidates (Aug 2026) — https://www.iol.co.za/news/politics/anc-names-chikane-morero-and-masuku-as-potential-johannesburg-mayoral-candidates-76c3476a-f388-41a8-9c89-4735f5b2e333"},{"q":"Why should a player avoid calling Chikane a confirmed ballot candidate without checking for updates?","options":["Because no political biographies exist","Because he does not appear on the ANC’s certified Johannesburg list and his status is unsettled","Because he was the DA’s candidate","Because he had already become mayor"],"a":1,"explain":"Business Day reported on 20 October that Chikane does not appear on the certified list, while the ANC’s Johannesburg regional secretary said national office-bearers could still nominate him. TimesLIVE reported on 25 October that he still lacked written confirmation. Check for newer updates.","source":"Business Day — Chikane’s mayoral hopes rest with ANC national leaders (20 Oct 2026) — https://www.businessday.co.za/politics/2026-10-20-chikanes-mayoral-hopes-rest-with-anc-national-leaders/ · TimesLIVE — Why Chikane has been largely absent from the ANC’s election campaign (25 Oct 2026) — https://www.timeslive.co.za/news/2026-10-24-why-chikane-has-been-largely-absent-from-the-ancs-election-campaign/"}]},{"id":"kenny-kunene","name":"Kenny Kunene","initials":"KK","party":"Patriotic Alliance · announced Joburg mayoral candidate","color":"#63c9ea","tag":"PA deputy president · Transport MMC","status":"The Patriotic Alliance announced Kunene as its Johannesburg mayoral candidate in 2025. In September 2026, Daily Maverick reported that he was Johannesburg Transport MMC and PA deputy president and had launched his mayoral campaign.","profile":"Kenny Kunene is the Patriotic Alliance’s deputy president and Johannesburg Transport MMC. At his September 2026 campaign launch he prioritised hijacked buildings, informal settlements, relief for residents behind on municipal payments and street lighting. He also made a sweeping self-claim about repairing more roads and potholes than any MMC since democracy; that comparison should not be presented as independently verified without comparable data.","sources":["https://independentonsaturday.co.za/news/politics/2025-09-16-patriotic-alliance-names-kunene-joburg-mayoral-hopeful-shifts-liam-jacobs-to-cape-town/","https://www.dailymaverick.co.za/article/2026-09-20-kenny-kunene-tells-joburg-god-gives-light-during-the-day-i-will-at-night/"],"promise":[{"statement":"At his September 2026 campaign launch, Kunene committed to a safer city with working lights on every electric pole.","kind":"promise","explain":"This is a stated campaign commitment. It is not proof that all streetlights currently work.","source":"Daily Maverick — Kenny Kunene’s Johannesburg mayoral campaign priorities (20 Sep 2026) — https://www.dailymaverick.co.za/article/2026-09-20-kenny-kunene-tells-joburg-god-gives-light-during-the-day-i-will-at-night/"},{"statement":"His campaign priorities included hijacked buildings, informal settlements and debt relief for residents behind on municipal payments.","kind":"promise","explain":"These are reported campaign priorities, not completed outcomes.","source":"Daily Maverick — Kenny Kunene’s Johannesburg mayoral campaign priorities (20 Sep 2026) — https://www.dailymaverick.co.za/article/2026-09-20-kenny-kunene-tells-joburg-god-gives-light-during-the-day-i-will-at-night/"},{"statement":"Kunene said he had repaired more roads and potholes than any MMC since democracy.","kind":"unknown","explain":"The source reports this as Kunene’s own claim. The comparative superlative needs independent, comparable repair data before it can be treated as established performance.","source":"Daily Maverick — Kenny Kunene’s Johannesburg mayoral campaign priorities (20 Sep 2026) — https://www.dailymaverick.co.za/article/2026-09-20-kenny-kunene-tells-joburg-god-gives-light-during-the-day-i-will-at-night/"},{"statement":"The Patriotic Alliance announced Kunene as its Johannesburg mayoral candidate.","kind":"result","explain":"Independent on Saturday reported the party’s announcement in September 2025. This is a documented nomination, not proof he will be elected mayor.","source":"Independent on Saturday — Patriotic Alliance names Kunene Joburg mayoral hopeful (16 Sep 2025) — https://independentonsaturday.co.za/news/politics/2025-09-16-patriotic-alliance-names-kunene-joburg-mayoral-hopeful-shifts-liam-jacobs-to-cape-town/"}],"quiz":[{"q":"Which party announced Kunene as its Johannesburg mayoral candidate?","options":["DA","ANC","Patriotic Alliance","RISE Mzansi"],"a":2,"explain":"Independent on Saturday reported the Patriotic Alliance’s announcement.","source":"Independent on Saturday — Patriotic Alliance names Kunene Joburg mayoral hopeful (16 Sep 2025) — https://independentonsaturday.co.za/news/politics/2025-09-16-patriotic-alliance-names-kunene-joburg-mayoral-hopeful-shifts-liam-jacobs-to-cape-town/"},{"q":"Which city portfolio did Kunene hold during the 2026 campaign?","options":["Transport MMC","Finance MMC","Human Settlements MMC","Executive Mayor"],"a":0,"explain":"Daily Maverick identified him as Johannesburg Transport MMC.","source":"Daily Maverick — Kenny Kunene’s Johannesburg mayoral campaign priorities (20 Sep 2026) — https://www.dailymaverick.co.za/article/2026-09-20-kenny-kunene-tells-joburg-god-gives-light-during-the-day-i-will-at-night/"},{"q":"Which issues did his September campaign prioritise?","options":["Hijacked buildings, informal settlements and municipal-debt relief","Only provincial schools","Only national foreign policy","Only a single-card bus system"],"a":0,"explain":"The campaign report lists those three issue areas.","source":"Daily Maverick — Kenny Kunene’s Johannesburg mayoral campaign priorities (20 Sep 2026) — https://www.dailymaverick.co.za/article/2026-09-20-kenny-kunene-tells-joburg-god-gives-light-during-the-day-i-will-at-night/"},{"q":"What is the proper evidence status of his claim that he repaired more potholes than any MMC since democracy?","options":["Independently proven in the cited report","A reported claim by Kunene that needs comparable independent data","An official national statistic","A promise made by Helen Zille"],"a":1,"explain":"Daily Maverick reported the claim as Kunene’s statement and discussed infrastructure constraints; it did not independently establish the superlative.","source":"Daily Maverick — Kenny Kunene’s Johannesburg mayoral campaign priorities (20 Sep 2026) — https://www.dailymaverick.co.za/article/2026-09-20-kenny-kunene-tells-joburg-god-gives-light-during-the-day-i-will-at-night/"}],"memory":[{"q":"When did the PA announce Kunene as its Johannesburg mayoral candidate?","options":["September 2025","March 2026","September 2026","October 2022"],"a":0,"explain":"Independent on Saturday reported the announcement on 16 September 2025.","source":"Independent on Saturday — Patriotic Alliance names Kunene Joburg mayoral hopeful (16 Sep 2025) — https://independentonsaturday.co.za/news/politics/2025-09-16-patriotic-alliance-names-kunene-joburg-mayoral-hopeful-shifts-liam-jacobs-to-cape-town/"},{"q":"Which role did Kunene hold in Johannesburg’s City administration during the 2026 campaign?","options":["Transport MMC","Gauteng Premier","Mayor of Cape Town","City Speaker"],"a":0,"explain":"Daily Maverick described him as the City’s Transport MMC.","source":"Daily Maverick — Kenny Kunene’s Johannesburg mayoral campaign priorities (20 Sep 2026) — https://www.dailymaverick.co.za/article/2026-09-20-kenny-kunene-tells-joburg-god-gives-light-during-the-day-i-will-at-night/"},{"q":"Which safety issue featured in his campaign promise?","options":["Working streetlights","A 72-hour pothole pledge","200,000 new jobs","Affordable rentals in Sandton only"],"a":0,"explain":"He committed to working lights on every electric pole as part of a safer-city message.","source":"Daily Maverick — Kenny Kunene’s Johannesburg mayoral campaign priorities (20 Sep 2026) — https://www.dailymaverick.co.za/article/2026-09-20-kenny-kunene-tells-joburg-god-gives-light-during-the-day-i-will-at-night/"},{"q":"Why should his “more potholes than any MMC since democracy” statement be treated carefully?","options":["It is mathematically impossible to count roads","It is a self-reported comparison without the underlying comparable data in the cited report","Because only the DA may repair o’s announced 10-point plan includes housing, jobs, water, roads, infrastructure and municipal finance.","kind":"promise","explain":"This summarises the themes listed in campaign coverage; they are priorities to pursue, not achieved outcomes.","source":"EWN — 16 May 2026 — https://www.ewn.co.za/2026/05/16/ifp-announces-mlungisi-mabaso-as-its-joburg-mayoral-candidate"},{"statement":"Mabaso said youth development should include better sports and recreation facilities to help create opportunities for young people.","kind":"promise","explain":"This is a stated campaign commitment in his acceptance remarks, not evidence that new facilities have already been delivered.","source":"EWN — 16 May 2026 — https://www.ewn.co.za/2026/05/16/ifp-announces-mlungisi-mabaso-as-its-joburg-mayoral-candidate"},{"statement":"The IFP’s announcement states that Mabaso had already been elected Executive Mayor of Johannesburg.","kind":"contradicted","explain":"Contradicted by the cited article, which identifies him as the IFP’s mayoral candidate and a current MMC—not the elected executive mayor.","source":"EWN — 16 May 2026 — https://www.ewn.co.za/2026/05/16/ifp-announces-mlungisi-mabaso-as-its-joburg-mayoral-candidate"}],"quiz":[{"q":"Which party announced Mlungisi Mabaso as its Johannesburg mayoral candidate?","options":["IFP","EFF","DA","Patriotic Alliance"],"a":0,"explain":"The IFP announced Mabaso as its Joburg candidate on 16 May 2026.","source":"EWN — https://www.ewn.co.za/2026/05/16/ifp-announces-mlungisi-mabaso-as-its-joburg-mayoral-candidate"},{"q":"Which City of Johannesburg portfolio did Mabaso hold in the candidate announcement?","options":["Finance","Human Settlements","Transport","Environment"],"a":1,"explain":"EWN identified Mabaso as the City’s MMC for Human Settlements.","source":"EWN — https://www.ewn.co.za/2026/05/16/ifp-announces-mlungisi-mabaso-as-its-joburg-mayoral-candidate"},{"q":"What kind of plan did Mabaso present for Johannesburg?","options":["A 10-point rescue plan","A three-day caretaker plan","A national tax plan","A transport-only plan"],"a":0,"explain":"Campaign reporting described his proposals as a 10-point rescue plan.","source":"eNCA — IFP’s Mlungisi Mabaso readies his 10-point plan to fix Joburg — https://www.enca.com/top-stories/ifps-mlungisi-mabaso-readies-his-10-point-plan-fix-joburg"},{"q":"Which topics are named in Mabaso’s 10-point plan, according to eNCA?","options":["Water, roads, housing and smart billing","Abolishing municipal rates","A national airline","Free tertiary education"],"a":0,"explain":"eNCA reports that the plan covers economic recovery, visible policing, water, infrastructure, roads, housing, land, finances, smart billing and protection of whistleblowers.","source":"eNCA — IFP’s Mlungisi Mabaso readies his 10-point plan to fix Joburg — https://www.enca.com/top-stories/ifps-mlungisi-mabaso-readies-his-10-point-plan-fix-joburg"}],"memory":[{"q":"On what date did EWN report the IFP’s announcement of Mabaso as Joburg mayoral candidate?","options":["16 May 2026","23 May 2026","27 July 2026","16 September 2026"],"a":0,"explain":"The announcement was reported on 16 May 2026.","source":"EWN — https://www.ewn.co.za/2026/05/16/ifp-announces-mlungisi-mabaso-as-its-joburg-mayoral-candidate"},{"q":"Which MMC portfolio was attached to Mabaso in the announcement?","options":["Human Settlements","Transport","Finance","Public Safety"],"a":0,"explain":"He was identified as the MMC for Human Settlements.","source":"EWN — https://www.ewn.co.za/2026/05/16/ifp-announces-mlungisi-mabaso-as-its-joburg-mayoral-candidate"},{"q":"How many points were in the IFP plan reported at Mabaso’s launch?","options":["5","7","10","20"],"a":2,"explain":"The IFP launch was reported as a 10-point rescue plan.","source":"eNCA — IFP’s Mlungisi Mabaso readies his 10-point plan to fix Joburg — https://www.enca.com/top-stories/ifps-mlungisi-mabaso-readies-his-10-point-plan-fix-joburg"},{"q":"Which youth-related priority did Mabaso mentio y mayor, according to October 2026 reporting?","options":["ANC Johannesburg regional chairperson","ANC Gauteng provincial secretary","DA federal council chairperson","ActionSA deputy president"],"a":0,"explain":"Business Day describes her as the ANC’s Johannesburg regional chair and executive deputy mayor.","source":"Business Day — Chikane’s mayoral hopes rest with ANC national leaders (20 Oct 2026) — https://www.businessday.co.za/politics/2026-10-20-chikanes-mayoral-hopes-rest-with-anc-national-leaders/"}],"memory":[{"q":"Which three ANC figures appeared on the public Joburg shortlist?","options":["Masuku, Morero and Chikane","Masuku, Zille and Mashaba","Masuku, Makhura and Kunene","Masuku, Mnguni and Zille"],"a":0,"explain":"The August public list named Masuku, Morero and Chikane.","source":"IOL — ANC names Chikane, Morero and Masuku as potential Johannesburg mayoral candidates (Aug 2026) — https://www.iol.co.za/news/politics/anc-names-chikane-morero-and-masuku-as-potential-johannesburg-mayoral-candidates-76c3476a-f388-41a8-9c89-4735f5b2e333"},{"q":"What is the difference between “shortlisted” and “selected”?","options":["They always mean the same thing","Shortlisted means considered; selected means formally chosen","Shortlisted means already elected mayor","Selected means only mentioned in the media"],"a":1,"explain":"The ANC’s later decision not to publish a sole preferred candidate makes that distinction important.","source":"Daily Maverick — ANC will not announce its preferred mayoral candidates before the election (19 Oct 2026) — https://www.dailymaverick.co.za/article/2026-10-19-anc-abandons-plan-to-name-mayoral-candidates-amid-fears-of-supporter-backlash/"},{"q":"On the ANC’s certified Johannesburg proportional-representation list reported on 20 October, who was placed first?","options":["Loyiso Masuku","Dada Morero","Frank Chikane","David Makhura"],"a":0,"explain":"Business Day reported Masuku first on the list, with Morero fourth, and noted that Chikane d g the U20 Summit in 2025.","source":"City of Johannesburg — official Executive Mayor profile"},{"q":"What had the ANC publicly done by 19 October about selecting one Joburg mayoral nominee?","options":["Confirmed Morero alone","Confirmed Masuku alone","Announced it would not publicly name a single preferred candidate before the election","Named David Makhura"],"a":2,"explain":"Daily Maverick reported that the ANC decided not to announce its preferred mayoral candidates before election day.","source":"Daily Maverick — ANC will not announce its preferred mayoral candidates before the election (19 Oct 2026) — https://www.dailymaverick.co.za/article/2026-10-19-anc-abandons-plan-to-name-mayoral-candidates-amid-fears-of-supporter-backlash/"}]},{"id":"helen-zille","name":"Helen Zille","initials":"HZ","party":"Democratic Alliance (DA) · announced Joburg mayoral candidate","color":"#ffb74d","tag":"DA candidate · five campaign pledges","status":"The DA publicly identifies Helen Zille as its Johannesburg mayoral candidate. Her campaign has published specific commitments; the targets listed here are promises, not achieved results.","profile":"Helen Zille was Mayor of Cape Town from 2006 to 2009 and Premier of the Western Cape from 2009 to 2019. In her March 2026 Joburg campaign pledges, she committed to reliable water and electricity, potholes fixed within 72 hours (which she framed as achievable by the end of her term), 95% of traffic lights working, 200,000 new jobs, safer public spaces and a more professional government.","sources":["https://www.da.org.za/2026/03/zille-launches-joburg-campaign-pledges","https://www.ewn.co.za/2026/03/07/da-says-joburg-administration-has-failed-to-address-pothole-issue","https://www.da.org.za/people/helen-zille-2"],"promise":[{"statement":"Zille pledged that, by the end of her term, potholes in Johannesburg would be fixed within 72 hours of being reported.","kind":"promise","explain":"This is an explicit campaign target, which Zille framed as edges"},{"q":"What pothole-repair timeframe did Zille’s 2026 campaign pledge?","options":["24 hours","48 hours","72 hours","30 days"],"a":2,"explain":"The pledge says potholes would be fixed within 72 hours of being reported; Zille framed this as achievable by the end of her term.","source":"Democratic Alliance — Helen Zille’s five Johannesburg campaign pledges (7 Mar 2026) — https://www.da.org.za/2026/03/zille-launches-joburg-campaign-pledges · EWN — DA says Joburg administration has failed to address pothole issue (7 Mar 2026) — https://www.ewn.co.za/2026/03/07/da-says-joburg-administration-has-failed-to-address-pothole-issue"},{"q":"What share of traffic lights did her pledge target getting working?","options":["75%","85%","95%","100%"],"a":2,"explain":"The campaign page states a 95% target.","source":"Democratic Alliance — Helen Zille’s five Johannesburg campaign pledges (7 Mar 2026) — https://www.da.org.za/2026/03/zille-launches-joburg-campaign-pledges"},{"q":"How many new jobs did the campaign pledge say it aimed to attract to Joburg?","options":["20,000","50,000","100,000","200,000"],"a":3,"explain":"The published pledge names 200,000 new jobs as a five-year priority.","source":"Democratic Alliance — Helen Zille’s five Johannesburg campaign pledges (7 Mar 2026) — https://www.da.org.za/2026/03/zille-launches-joburg-campaign-pledges"}],"memory":[{"q":"Which mayoral target was set at 72 hours?","options":["Repair potholes","Create 200,000 jobs","Fix all billing accounts","Reach 90% revenue collection"],"a":0,"explain":"The 72-hour timeframe applies to the pothole pledge.","source":"Democratic Alliance — Helen Zille’s five Johannesburg campaign pledges (7 Mar 2026) — https://www.da.org.za/2026/03/zille-launches-joburg-campaign-pledges"},{"q":"Which number was attached to the traffic-light pledge?","options":["72%","90%","95%","200,000%"],"a":2,"explain":"The pledge set a target of 95% of traffic lights working.","source":"Democratic Alliance — Helen Zille’s five const PROMISE_OPTIONS = ['A promise or target','A documented fact','Not enough evidence','Contradicted by the source'];
const KIND_INDEX = {promise:0,result:1,unknown:2,contradicted:3};
const MM_MODES = {
  promise:{id:'promise',icon:'🧾',title:'Promise or Performance?',subtitle:'Can you separate the pledge from the proof?',label:'SPOT THE DIFFERENCE',colour:'#35d07f',desc:'Sort pledges, documented facts, claims that need evidence and claims the sources contradict.'},
  party:{id:'party',icon:'🧠',title:'Know Your Candidate',subtitle:'Beyond the slogans. How much do you actually know?',label:'CANDIDATE KNOWLEDGE',colour:'#63c9ea',desc:'A fast-fire quiz on who they are, what they have said and how to check the receipts.'},
  memory:{id:'memory',icon:'🗂️',title:'Political Memory Test',subtitle:'Remember the details everyone else scrolls past?',label:'THE MEMORY TEST',colour:'#b58cff',desc:'Recall the dates, targets and details behind the story.'}
};
const MM = {
  state:{screen:'home',candidate:null,mode:null,index:0,score:0,streak:0,correct:0,answers:[],answered:false,lastChoice:null},
  stats:{games:0,xp:0,bests:{}},
  escape(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))},
  host(u){return String(u).replace(/^https?:\/\/(www\.)?/,'').split('/')[0]},
  date(){return new Date(MM_DATA.contentUpdated+'T00:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})},
  linkSource(s){return this.escape(s).replace(/(https?:\/\/[^\s<]+)/g,u=>{const t=u.replace(/^https?:\/\/(www\.)?/,'').replace(/&amp;/g,'&');return '<a href="'+u+'" target="_blank" rel="noopener noreferrer">'+(t.length>48?t.slice(0,48)+'…':t)+'</a>'})},
  loadStats(){try{const s=JSON.parse(localStorage.getItem('mm-arcade-stats')||'{}');this.stats={games:Number(s.games)||0,xp:Number(s.xp)||0,bests:s.bests||{}}}catch(e){}},
  saveStats(){try{localStorage.setItem('mm-arcade-stats',JSON.stringify(this.stats))}catch(e){}},
  current(){return MM_DATA.candidates.find(c=>c.id===this.state.candidate)||MM_DATA.candidates[0]},
  home(){this.state.screen='home';this.render()},
  chooseCandidate(id){this.state.candidate=id;this.state.screen='games';this.render();window.scrollTo({top:0,behavior:'smooth'})},
  goCandidates(){this.state.screen='home';this.render();window.scrollTo({top:0,behavior:'smooth'})},
  chooseMode(id){Object.assign(this.state,{mode:id,index:0,score:0,streak:0,correct:0,answers:[],answered:false,lastChoice:null,screen:'game'});this.render();window.scrollTo({top:0,behavior:'smooth'})},
  questions(){const c=this.current(),m=this.state.mode;
    if(m==='promise')return c.promise.map(x=>({q:x.statement,options:PROMISE_OPTIONS,a:KIND_INDEX[x.kind],explain:x.explain,source:x.source,kicker:'PROMISE OR PERFORMANCE'}));
    if(m==='party')return c.quiz.map(x=>({...x,kicker:'KNOW YOUR CANDIDATE'}));
    return c.memory.map(x=>({...x,kicker:'POLITICAL MEMORY TEST'}))},
  render(){this.loadStats();const root=document.getElementById('mm-app');if(!root)return;
    const s=this.state.screen;root.innerHTML=s==='home'?this.viewHome():s==='games'?this.viewGames():s==='game'?this.viewQuestion():this.viewResult()},
  viewHome(){return `<section class="mm-screen"><div class="mm-hero"><div><div class="mm-eyebrow"><span class="mm-dot"></span> Politics, but make it a game</div><h1>HOW WELL DO YOU<br><em>KNOW THE GAME?</em></h1><p>Pick a candidate from the Johannesburg mayoral race. Play quick-fire rounds built from public reporting, learn the facts and get a shareable score. No party card required.</p></div><div class="mm-hero-art"><span class="mm-art-big" aria-hidden="true">🎮</span><span class="mm-art-sticker">YOUR TURN, SA</span><span class="mm-art-caption">Knowledge is power-ish</span></div></div><div class="mm-stats"><div class="mm-stat"><b>${this.stats.games}</b><span>Games played</span></div><div class="mm-stat"><b>${this.stats.xp.toLocaleString()}</b><span>XP earned</span></div><div class="mm-stat"><b>${Object.keys(this.stats.bests).length}</b><span>Personal bests</span></div></div><div class="mm-section-head"><div><h2>Choose your candidate</h2><p>Listed A to Z by surname. Each profile opens its own set of games.</p></div><span class="mm-tag">${MM_DATA.candidates.length} candidates</span></div>${MM_DATA.candidateRoundsEnabled===false?`<div class="mm-empty">Candidate rounds are paused while the facts are re-checked. Please check back soon.</div>`:`<div class="mm-candidate-grid">${MM_DATA.candidates.map(c=>`<button class="mm-candidate" style="--c:${c.color}" onclick="MM.chooseCandidate('${c.id}')"><span class="mm-cand-top"><span class="mm-avatar">${this.escape(c.initials)}</span><span class="mm-arrow">↗</span></span><h3>${this.escape(c.name)}</h3><div class="mm-party">${this.escape(c.party)}</div><p class="mm-teaser">${this.escape(c.tag)}</p><div class="mm-hint">Tap to play</div></button>`).join('')}</div>`}<p class="mm-footnote">${this.escape(MM_DATA.coverageNote)} Election day: ${this.escape(MM_DATA.electionDate)}. Content last checked ${this.date()}; political situations change quickly.</p></section>`},
  viewGames(){const c=this.current(),best=Object.entries(this.stats.bests).filter(([k])=>k.startsWith(c.id+'-')).reduce((m,[,v])=>Math.max(m,v),0),srcs=(c.sources||[]).map(u=>`<a href="${this.escape(u)}" target="_blank" rel="noopener noreferrer">${this.escape(this.host(u))}</a>`).join(', ');
    return `<section class="mm-screen"><button class="mm-back" onclick="MM.goCandidates()">← All candidates</button><div class="mm-profile-banner"><div class="mm-profile-avatar" style="background:${c.color}">${this.escape(c.initials)}</div><div class="mm-profile-info"><h2>${this.escape(c.name)}</h2><p>${this.escape(c.party)} · ${this.escape(c.tag)}</p></div><div class="mm-mini-score"><b>${best}</b><span>Best XP</span></div></div><div class="mm-status"><h3>Where things stand · checked ${this.date()}</h3><p>${this.escape(c.status)}</p><details class="mm-about"><summary>About ${this.escape(c.name)}</summary><p>${this.escape(c.profile)}</p></details>${srcs?`<p class="mm-status-src">Sources: ${srcs}</p>`:''}</div><div class="mm-section-head"><div><h2>Pick your game</h2><p>Quick rounds. Every answer comes with its source.</p></div><span class="mm-tag">${Object.keys(MM_MODES).length} modes</span></div><div class="mm-tagline"><strong>HOW TO WIN:</strong> Answer, learn why, build your streak and beat your personal best. A wrong answer still teaches you something.</div><div class="mm-games-grid">${Object.values(MM_MODES).map(m=>`<button class="mm-game-card" style="--gc:${m.colour}" onclick="MM.chooseMode('${m.id}')"><span class="mm-game-icon">${m.icon}</span><h3>${m.title}</h3><p>${m.desc}</p><div class="mm-game-meta"><span>${m.label} · 4 questions</span><span class="mm-play-arrow">↗</span></div></button>`).join('')}</div></section>`},
  viewQuestion(){const qs=this.questions(),q=qs[this.state.index],mode=MM_MODES[this.state.mode],c=this.current();if(!q)return this.finish();const pct=Math.round((this.state.index/qs.length)*100);
    return `<section class="mm-screen mm-game-layout"><button class="mm-back" onclick="MM.abortGame()">← Quit round</button><div class="mm-game-head"><div class="mm-game-icon-box" style="background:${mode.colour}">${mode.icon}</div><div><h2>${mode.title}</h2><p>${this.escape(c.name)} · ${this.escape(c.tag)}</p></div><div class="mm-head-score"><b>${this.state.score}</b><span>Points</span></div></div><div class="mm-progress-row"><span class="mm-progress-label">Round ${this.state.index+1} of ${qs.length}</span><span class="mm-progress-label">🔥 Streak ${this.state.streak}</span></div><div class="mm-progress-track"><div class="mm-progress-fill" style="width:${pct}%"></div></div><article class="mm-question-card"><p class="mm-q-kicker">${q.kicker||mode.label} · QUESTION ${this.state.index+1}</p><h3>${this.escape(q.q)}</h3><div class="mm-options">${q.options.map((op,i)=>{let cls='';if(this.state.answered&&i===q.a)cls=' mm-correct';else if(this.state.answered&&this.state.lastChoice===i&&i!==q.a)cls=' mm-wrong';return `<button class="mm-option${cls}" ${this.state.answered?'disabled':''} onclick="MM.answer(${i})"><span class="mm-option-key">${String.fromCharCode(65+i)}</span><span class="mm-option-text">${this.escape(op)}</span></button>`}).join('')}</div>${this.state.answered?`<div class="mm-feedback ${this.state.lastChoice===q.a?'mm-feedback-good':'mm-feedback-bad'}" role="status"><h4>${this.state.lastChoice===q.a?'✅ Nailed it! + points':'🫣 Not quite — now you know.'}</h4><p>${this.escape(q.explain)}</p>${q.source?`<div class="mm-source">Source: ${this.linkSource(q.source)}</div>`:''}</div>`:''}<div class="mm-question-actions"><span class="mm-tip">${this.state.answered?'Every answer reveals the why.':'Pick the best answer. Trust your instincts.'}</span>${this.state.answered?`<button class="mm-btn" onclick="MM.nextQuestion()">${this.state.index===qs.length-1?'See my result':'Next question'} →</button>`:''}</div></article></section>`},
  answer(i){if(this.state.answered)return;const q=this.questions()[this.state.index];this.state.answered=true;this.state.lastChoice=i;const right=i===q.a;if(right){this.state.streak++;this.state.correct++;this.state.score+=100+Math.min((this.state.streak-1)*25,100)}else this.state.streak=0;this.state.answers.push({correct:right,choice:i});this.render()},
  nextQuestion(){if(this.state.index+1>=this.questions().length){this.finish()}else{this.state.index++;this.state.answered=false;this.state.lastChoice=null;this.render();window.scrollTo({top:0,behavior:'smooth'})}},
  abortGame(){if(confirm('Leave this round? Your score for this round will not be saved.')){this.state.screen='games';this.render()}},
  finish(){const s=this.state,n=s.answers.length,max=n*100+Math.max(0,n-1)*25,accuracy=Math.round(s.correct/n*100),
    headline=accuracy===100?'POLITICAL ENCYCLOPAEDIA':accuracy>=75?'YOU DID YOUR HOMEWORK':accuracy>=50?'GETTING THE PICTURE':'BACK TO THE MANIFESTO',
    emoji=accuracy===100?'🧠':accuracy>=75?'🔥':accuracy>=50?'👀':'📚',
    copy=`You got ${s.correct} out of ${n} right. ${accuracy>=75?'Strong showing. Now send the challenge to someone who thinks they know more.':accuracy>=50?'You’re getting there. The explanations are the best part, so play again to beat your score.':'Good thing this is practice. You just picked up a few useful facts.'}`;
    this.stats.games++;this.stats.xp+=s.score;const key=`${s.candidate}-${s.mode}`,old=this.stats.bests[key]||0;this.stats.bests[key]=Math.max(old,s.score);this.saveStats();
    s.final={accuracy,headline,emoji,copy,max,personalBest:s.score>=old};s.screen='result';this.render();window.scrollTo({top:0,behavior:'smooth'})},
  viewResult(){const s=this.state,c=this.current(),m=MM_MODES[s.mode],r=s.final||{accuracy:0,headline:'ROUND COMPLETE',emoji:'🎮',copy:'Nice run.',max:1};
    return `<section class="mm-screen mm-game-layout"><div class="mm-result-hero"><div class="mm-result-badge">${r.personalBest?'✦ New personal best':'✦ Round complete'}</div><div class="mm-result-emoji">${r.emoji}</div><h2>${this.escape(r.headline)}</h2><p>${this.escape(r.copy)}</p><div class="mm-score-big">${s.score}<small> XP</small></div><div class="mm-result-line">${this.escape(c.name)} · ${this.escape(m.title)}</div></div><div class="mm-result-stats"><div class="mm-result-stat"><b>${s.correct}/${s.answers.length}</b><span>Correct answers</span></div><div class="mm-result-stat"><b>${r.accuracy}%</b><span>Accuracy</span></div><div class="mm-result-stat"><b>${s.streak} 🔥</b><span>Final streak</span></div></div><div class="mm-result-actions"><button class="mm-btn" onclick="MM.shareResult()">↗ Share my result</button><button class="mm-btn mm-btn-secondary" onclick="MM.chooseMode('${s.mode}')">↻ Play again</button><button class="mm-btn mm-btn-secondary" onclick="MM.state.screen='games';MM.render()">Try another game</button><button class="mm-btn mm-btn-quiet" onclick="MM.goCandidates()">Switch candidate</button></div><p class="mm-smallprint">Scores measure how you did in this quiz. They are not ratings of any person or party. Facts reflect public reporting as of ${this.date()} and may have changed since.</p></section>`},
  async shareResult(){const s=this.state,m=MM_MODES[s.mode],url=location.href,txt=`I scored ${s.score} XP in ${m.title} on the Mayor Meter Arcade. Can you beat my score?`;
    try{if(navigator.share){await navigator.share({title:'Mayor Meter Arcade challenge',text:txt,url})}else if(navigator.clipboard&&navigator.clipboard.writeText){await navigator.clipboard.writeText(txt+' '+url);alert('Challenge copied. Paste it into WhatsApp or your social feed.')}else{prompt('Copy your challenge:',txt+' '+url)}}catch(e){if(e.name!=='AbortError')alert('Could not open sharing on this device. You can still copy your score: '+txt)}}
};
MM.loadStats();MM.render();

</script>
